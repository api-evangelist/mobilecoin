    A wallet account associated with one AccountKey (a View keypair and a Spend
    keypair).
- name: AccountSecrets
  description: The secret mnemonic / keys for an account, returned separately.
- name: ViewOnlyAccount
  description: An account imported with only the view key (cannot spend).
- name: Address
  description: >-
    A public subaddress derived from the AccountKey (public View + Spend keys,
