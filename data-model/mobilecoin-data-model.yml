- name: TXO
  description: A Transaction Output in the UTXO ledger model.
- name: Transaction
  description: Inputs spent to mint new TXOs for a recipient.
- name: TransactionLog
  description: Record of a transaction constructed/sent (or received) by the wallet.
- name: Confirmation
  description: Confirmation number minted per TXO to prove sender-TXO association.
- name: ReceiverReceipt
  description: Confirmation number the recipient polls for transaction status.
- name: PaymentRequest
  description: A b58 payment-request code.
- name: GiftCode
  description: A one-time account holding a single TXO (v1 surface).
- name: Block
  description: Ledger primitive consisting of TXOs and Key Images.
- name: WalletStatus
  description: Aggregate overview of wallet contents.
- name: NetworkStatus
  description: Current network fee and total block count.
