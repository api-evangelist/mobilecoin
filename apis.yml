aid: mobilecoin
name: Mobilecoin
description: >-
  MobileCoin is a privacy-focused, mobile-first cryptocurrency and payments
  network whose consumer wallet has since been rebranded as Sentz (send, save,
  receive and earn in stablecoins, including the eUSD stablecoin). For
  developers and exchanges, MobileCoin publishes the open-source Full-Service
  Wallet API - a JSON-RPC 2.0 service (default 127.0.0.1:9090) that creates and
  manages accounts, assigns addresses, builds/submits transactions against the
  UTXO ledger, reads balances, and queries blocks and network status. It ships
  first-party Python, Swift (iOS), Android, and Flutter SDKs plus a Python CLI,
  with documentation on GitBook and open code across the mobilecoinofficial and
  mobilecoinfoundation GitHub organizations.
